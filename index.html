(function(){
  // Update manifest icons dynamically
  const mf=document.querySelector('link[rel="manifest"]');
  const ai=document.getElementById('apple-icon');
  if(mf&&ai){
    try{
      const obj=JSON.parse(decodeURIComponent(mf.href.replace('data:application/manifest+json,','')));
      obj.icons=[{src:ai.href,sizes:'512x512',type:'image/png'},{src:ai.href,sizes:'192x192',type:'image/png'}];
      obj.background_color='#FF9F66';obj.theme_color='#FF9F66';
      mf.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(obj));
    }catch(e){}
  }
})();
</script>
<script>
(function(){
  function rr(g,x,y,w,h,r){
    g.beginPath();
    g.moveTo(x+r,y);
    g.lineTo(x+w-r,y);g.arcTo(x+w,y,x+w,y+r,r);
    g.lineTo(x+w,y+h-r);g.arcTo(x+w,y+h,x+w-r,y+h,r);
    g.lineTo(x+r,y+h);g.arcTo(x,y+h,x,y+h-r,r);
    g.lineTo(x,y+r);g.arcTo(x,y,x+r,y,r);
    g.closePath();
  }
  function makeIcon(size){
    const c=document.createElement('canvas');
    c.width=c.height=size;
    const g=c.getContext('2d');
    const s=size/100;
    // orange circle
    g.fillStyle='#FF9F66';
    g.beginPath();g.arc(size/2,size/2,size/2,0,Math.PI*2);g.fill();
    // nipple
    g.fillStyle='rgba(255,255,255,0.65)';
    rr(g,39*s,8*s,22*s,13*s,6*s);g.fill();
    // collar
    g.fillStyle='rgba(255,255,255,0.85)';
    rr(g,28*s,20*s,44*s,10*s,5*s);g.fill();
    // body
    g.fillStyle='#ffffff';
    rr(g,22*s,29*s,56*s,64*s,15*s);g.fill();
    // milk stripe 1
    g.fillStyle='rgba(255,159,102,0.38)';
    rr(g,32*s,54*s,36*s,7*s,3.5*s);g.fill();
    // milk stripe 2
    g.fillStyle='rgba(255,159,102,0.26)';
    rr(g,36*s,66*s,28*s,6*s,3*s);g.fill();
    return c.toDataURL('image/png');
  }
  const png512=makeIcon(512);
  const png192=makeIcon(192);
  const png64=makeIcon(64);
  document.getElementById('favicon').href=png64;
  document.getElementById('apple-icon').href=png512;
  const mf=document.querySelector('link[rel="manifest"]');
  if(mf){
    try{
      const obj=JSON.parse(decodeURIComponent(mf.href.replace('data:application/manifest+json,','')));
      obj.icons=[{src:png512,sizes:'512x512',type:'image/png'},{src:png192,sizes:'192x192',type:'image/png'}];
      obj.background_color='#FF9F66';obj.theme_color='#FF9F66';
      mf.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(obj));
    }catch(e){}
  }
})();
</script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{font-family:'Varela Round','Quicksand',sans-serif;direction:rtl;background:#FFF9F5;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
button{font-family:'Varela Round','Quicksand',sans-serif}
button *{pointer-events:none}
input,textarea{font-family:'Varela Round','Quicksand',sans-serif}
.material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;display:inline-block;line-height:1}
.playful-card{background:#fff;border:2px solid #F5EFEA;box-shadow:0 6px 0px rgba(216,199,188,0.25);transition:transform 0.1s ease,box-shadow 0.1s ease}
.playful-card:active{transform:translateY(2px);box-shadow:0 3px 0px rgba(216,199,188,0.25)}
.nurture-bar-style{background:#FFF3C2;border:2px solid #F4D03F}
.btn-pill-primary{border-radius:9999px;padding:12px 24px;font-weight:700;background:#FF9F66;color:#fff;border:none;transition:all 0.2s}
@keyframes bounce-soft{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.timer-active-anim{animation:bounce-soft 2s infinite ease-in-out}
::-webkit-scrollbar{display:none}
.sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:6px}
.sync-dot.ok{background:#4CAF82}
.sync-dot.busy{background:#FFB300;animation:pulse .8s infinite}
.sync-dot.err{background:#E05A5A}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* ML Slider */
#feed-alert{animation:slideDown .4s ease}
@keyframes slideDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
/* Card entrance animation */
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.log-card-new{animation:fadeSlideIn .35s ease forwards}
/* Today card highlight pulse */
@keyframes todayGlow{0%,100%{box-shadow:0 6px 0px rgba(216,199,188,0.25)}50%{box-shadow:0 8px 20px rgba(255,159,102,0.18)}}
#bt-confirm{position:fixed;inset:0;background:rgba(10,30,60,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
#bt-confirm-box{background:#fff;border-radius:16px;padding:24px 20px;width:100%;max-width:320px;text-align:center;direction:rtl;font-family:'Nunito',sans-serif;box-shadow:0 8px 32px rgba(0,0,0,0.18)}
#bt-confirm-msg{font-size:16px;font-weight:800;color:#3A4A5C;margin-bottom:20px;line-height:1.4}
#bt-confirm-btns{display:flex;gap:10px}
#bt-confirm-btns button{flex:1;padding:13px 0;border-radius:10px;border:none;font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;cursor:pointer}
#bt-confirm-yes{background:#F06292;color:#fff;border-radius:10px}
#bt-confirm-no{background:#f0f4f8;color:#3A4A5C}
/* Desktop wrapper */
#app-inner{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
@media(min-width:600px){
  body{background:#FFE4CC}
  #app-inner{box-shadow:0 0 40px rgba(255,159,102,0.18);background:#FFF9F5}
}
</style>

async function sbFetch(path,opts={}){
  const res=await fetch(SB_URL+"/rest/v1/"+path,{
    headers:{
      "apikey":SB_KEY,
      "Authorization":"Bearer "+SB_KEY,
      "Content-Type":"application/json",
      "Prefer":opts.prefer||"return=representation",
      ...(opts.headers||{})
    },
    ...opts
  });
  if(!res.ok){const t=await res.text();throw new Error(t);}
  const t=await res.text();
  return t?JSON.parse(t):[];
}

const dur=ms=>{const m=Math.floor(ms/60000);return m<60?m+" דק׳":Math.floor(m/60)+":"+String(m%60).padStart(2,"0")+" שע׳"};
const calcAge=dob=>{
  if(!dob)return null;
  const days=Math.floor((Date.now()-new Date(dob))/86400000);
  if(days<7)return days+" ימים";
  const w=Math.floor(days/7),rd=days%7;
  if(w<8)return rd>0?w+" שבועות ו-"+rd+" ימים":w+" שבועות";
  const mo=Math.floor(days/30.44),rmd=Math.floor(days-mo*30.44);
  if(mo<24)return rmd>3?mo+" חודשים ו-"+Math.floor(rmd/7)+" שבועות":mo+" חודשים";
  const y=Math.floor(mo/12),rm=mo%12;
  return rm>0?y+" שנים ו-"+rm+" חודשים":y+" שנים";
};

function exportCSV(logs,name){
  const rows=[["שם","סוג","פירוט","מ״ל","כמות/משך","שעה","תאריך","הערה"]];
  logs.forEach(l=>{
    const feedLabel=l.subtype?l.subtype.split(",").map(s=>FEED_TYPES.find(f=>f.value===s)?.label||s).join(" + "):"";
    const diaperLabel=DIAPER_TYPES.find(d=>d.value===l.subtype)?.label||"";
    rows.push([
      name,
      CAT[l.type]?.label||l.type,
      feedLabel||diaperLabel||l.medName||"",
      l.ml||"",
      l.amount||(l.durationMs?dur(l.durationMs):""),
      new Date(l.ts).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"}),
      new Date(l.ts).toLocaleDateString("he-IL"),
      l.note||""
    ]);
  });
  const csv="\uFEFF"+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
  a.download=name+".csv";a.click();
}

function exportToSheets(logs,name){
  const rows=[["שם","סוג","פירוט","מ״ל סה״כ","כמות/משך","שעה","תאריך","הערה"]];
  logs.forEach(l=>{
    if(l.type==="feed"&&l.subtype){
      const types=l.subtype.split(",").filter(Boolean);
      if(types.length>1){
        // row per type
        types.forEach(t=>{
          const ft=FEED_TYPES.find(f=>f.value===t);
          const m=l.mlByType?.[t]||"";
          rows.push([name,"האכלה",ft?.label||t,m,"",new Date(l.ts).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"}),new Date(l.ts).toLocaleDateString("he-IL"),l.note||""]);
        });
        return;
      }
    }
    const feedLabel=l.subtype?l.subtype.split(",").map(s=>FEED_TYPES.find(f=>f.value===s)?.label||s).join("+"):"";
    const diaperLabel=DIAPER_TYPES.find(d=>d.value===l.subtype)?.label||"";
    rows.push([
      name,
      CAT[l.type]?.label||l.type,
      feedLabel||diaperLabel||l.medName||"",
      l.ml||"",
      l.amount||(l.durationMs?dur(l.durationMs):""),
      new Date(l.ts).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"}),
      new Date(l.ts).toLocaleDateString("he-IL"),
      l.note||""
    ]);
  });
  const csv="\uFEFF"+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
  a.download=name+"-נתונים.csv"; a.click();
  setTimeout(()=>window.open("https://sheets.new","_blank"),800);
}

function localDtStr(ts){
  const d=ts?new Date(ts):new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function parseLocalDt(val){
  if(!val)return null;
  const[date,time]=val.split("T");
  const[y,mo,d]=date.split("-").map(Number);
  const[h,mi]=(time||"00:00").split(":").map(Number);
  return new Date(y,mo-1,d,h,mi).getTime();
}

// ── Init: load from Supabase ───────────────────────────────────────────────
async function init(){
  setState({screen:"loading"});
  const [result]=await Promise.allSettled([
    sb.getBabies(),
    new Promise(r=>setTimeout(r,3000))
  ]);
  if(result.status==="fulfilled"){
    const babies=result.value.map(rowToBaby);
    store.saveBabies(babies);
    setState({screen:"selector",babies});
  }else{
    console.warn("Supabase unavailable, using local:",result.reason);
    setState({screen:"selector",babies:store.getBabies(),syncStatus:"err"});
  }
}

        <button data-action="confirm-add" style="flex:2;background:linear-gradient(135deg,#FF9F66,#F07840);color:#fff;border:none;border-radius:14px;padding:13px 0;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 6px 16px rgba(255,159,102,0.4)">הוסף ✓</button>

    ${!state.addingBaby?`

      ${babies.map((b,i)=>`
        <div style="display:flex;flex-direction:column;align-items:center;gap:10px;animation:selector-pop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;animation-delay:${0.15+i*0.1}s;position:relative" class="baby-circle-btn">
          <div style="position:relative">
            <button data-action="select-baby" data-id="${b.id}" style="background:none;border:none;cursor:pointer;padding:0;display:block">

              <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 15.2A3.2 3.2 0 1 0 12 8.8a3.2 3.2 0 0 0 0 6.4z"/><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>

          <button data-action="delete-baby" data-id="${b.id}" class="baby-delete-btn" style="position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,0.9);border:1.5px solid #FFDBC1;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.2s;box-shadow:0 2px 6px rgba(0,0,0,0.1)">

      <!-- Add circle -->
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;animation:selector-pop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;animation-delay:${0.15+babies.length*0.1}s">

// ── Dashboard ──────────────────────────────────────────────────────────────
function renderDashboard(){
  const baby=state.selectedBaby;
  const logs=state.logs;
  const autoNight=new Date().getHours()>=21||new Date().getHours()<6;
  const isNight=state.isNight!==null?state.isNight:autoNight;
  const tp=isNight?"#EEF6FD":T.slate;
  const ts=isNight?"rgba(200,218,232,0.55)":T.muted;
  const bg=isNight?"#0D1B2A":"#FFF9F5";
  const C=(extra="")=>isNight
    ?`background:rgba(255,255,255,0.07);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid rgba(255,255,255,0.1);${extra}`
    :`background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;border:2px solid #F5EFEA;box-shadow:0 6px 0px rgba(216,199,188,0.25);${extra}`;

  const todayStart=new Date();todayStart.setHours(0,0,0,0);
  const todayLogs=logs.filter(l=>l.ts>=todayStart.getTime());
  const feeds=todayLogs.filter(l=>l.type==="feed");
  const diapers=todayLogs.filter(l=>l.type==="diaper");
  const sleeps=todayLogs.filter(l=>l.type==="sleep");
  const totalMl=feeds.reduce((s,l)=>s+(Number(l.ml)||0),0);
  const totalSlMs=sleeps.reduce((s,l)=>s+(l.durationMs||0),0);
  const age=calcAge(baby.dob);
  const catIcons={feed:ICONS.feed,diaper:ICONS.diaper,sleep:ICONS.moon,med:ICONS.med,note:ICONS.note};

  const allFeeds=[...logs].filter(l=>l.type==="feed").sort((a,b)=>Number(b.ts)-Number(a.ts));
  const lastFeed=allFeeds[0];
  const sinceMs=lastFeed?Date.now()-Number(lastFeed.ts):null;
  const sinceHours=sinceMs!==null?Math.floor(sinceMs/3600000):null;
  const sinceMin=sinceMs!==null?Math.floor((sinceMs%3600000)/60000):null;
  const alertStage=sinceMs===null?null:sinceMs>=4*3600000?"red":sinceMs>=2*3600000?"orange":"green";

  // Material Symbol helper
  const ms=(name,fill=1,sz=22,color="currentColor")=>
    `<span class="material-symbols-rounded" style="font-size:${sz}px;color:${color};font-variation-settings:'FILL' ${fill},'wght' 400,'GRAD' 0,'opsz' ${sz}">${name}</span>`;

  // ── Sticky Header ──────────────────────────────────────────────────────
  const header=`
    <header style="position:sticky;top:0;z-index:50;background:${isNight?"rgba(13,27,42,0.96)":"rgba(255,255,255,0.93)"};backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:2px solid ${isNight?"rgba(255,255,255,0.08)":"#F0E8E2"};padding:10px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px">
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button data-action="go-back" title="החלף תינוק" style="background:none;border:2px solid ${isNight?"rgba(255,255,255,0.15)":"#F0E8E2"};border-radius:9999px;width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center">
          ${ms("swap_horiz",0,20,isNight?"#FFD166":"#FF9F66")}
        </button>
        <button data-action="toggle-night" title="${isNight?"מצב יום":"מצב לילה"}" style="background:none;border:2px solid ${isNight?"rgba(255,255,255,0.15)":"#F0E8E2"};border-radius:9999px;width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center">
          ${ms(isNight?"light_mode":"dark_mode",0,20,isNight?"#FFD166":"#FF9F66")}
        </button>
      </div>
      <div style="flex:1;text-align:center">
        <div style="font-size:19px;font-weight:700;color:${tp};font-family:'Quicksand',sans-serif;line-height:1.2">${baby.name}</div>
        ${state.editDob?`
          <div style="display:flex;justify-content:center;gap:5px;margin-top:4px">
            <input id="dob-edit-input" type="date" value="${state.dobInput}" style="padding:4px 8px;border-radius:8px;border:1.5px solid #FF9F66;font-size:11px;font-family:inherit;outline:none;color:${T.slate}"/>
            <button data-action="save-dob" style="background:#FF9F66;color:#fff;border:none;border-radius:8px;padding:4px 8px;font-family:inherit;font-weight:700;font-size:11px;cursor:pointer">✓</button>
            <button data-action="cancel-dob" style="background:none;border:1.5px solid #F0E8E2;border-radius:8px;padding:4px 6px;font-family:inherit;font-weight:700;font-size:11px;cursor:pointer;color:${ts}">✕</button>
          </div>`:`
          <button data-action="edit-dob" style="background:none;border:none;cursor:pointer;font-family:inherit;font-size:11px;color:${ts};display:flex;align-items:center;gap:3px;margin:2px auto 0">
            ${age?`בן ${age}`:"הוסף תאריך לידה"}
          </button>`}
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
        <span id="sync-dot" class="sync-dot ${state.syncStatus}"></span>
        <input type="file" id="photo-input" accept="image/*" style="display:none"/>
        ${renderBabyAvatar(baby,44,true)}
      </div>
    </header>`;

  // ── Home Tab ──────────────────────────────────────────────────────────
  let mainContent="";
  if(state.tab==="home"){
    // Nurture Bar
    const nTime=sinceMs===null?"--:--":sinceHours>0?`${String(sinceHours).padStart(2,"0")}:${String(sinceMin).padStart(2,"0")}`:`00:${String(sinceMin).padStart(2,"0")}`;
    const nurtureBar=`
      <div style="padding:12px 16px 0;position:sticky;top:66px;z-index:40">
        <div style="background:${isNight?"rgba(255,243,194,0.1)":"#FFF3C2"};border:2px solid ${isNight?"rgba(244,208,63,0.25)":"#F4D03F"};border-radius:20px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between">
          <div>
            <span style="font-size:11px;font-weight:700;color:${isNight?"rgba(255,243,194,0.65)":"#8a7300"};display:block;margin-bottom:3px">זמן מאז האכלה אחרונה</span>
            <div style="display:flex;align-items:baseline;gap:5px">
              <span style="font-size:28px;font-weight:700;color:${isNight?"#FFF3C2":"#5a4a00"};font-family:'Quicksand',sans-serif;letter-spacing:-0.5px">${nTime}</span>
              <span style="font-size:13px;font-weight:700;color:${isNight?"#FFF3C2":"#5a4a00"}">שע׳</span>
            </div>
          </div>
          <div style="display:flex;gap:12px;align-items:center">
            <div style="display:flex;flex-direction:column;align-items:center;gap:3px">
              <div style="width:10px;height:10px;border-radius:50%;background:${alertStage==="red"?"#F06292":alertStage==="orange"?"#FF9F66":"#7FC09C"}"></div>
              <span style="font-size:9px;font-weight:700;color:${isNight?"#FFF3C2":"#8a7300"}">${alertStage==="red"?"דחוף":alertStage==="orange"?"שים לב":"תקין"}</span>
            </div>
            <button data-action="open-modal" data-type="feed" style="background:#FF9F66;color:#fff;border:none;border-radius:9999px;padding:11px 18px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 4px 10px rgba(255,159,102,0.4)">רשום האכלה</button>
          </div>
        </div>
      </div>`;

    // Stats Row
    const statsRow=`
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px">
        ${[
          {icon:"restaurant",val:feeds.length,sub:totalMl?totalMl+" מ״ל":"האכלות",color:"#FF9F66",bg:"#FFF0E6",border:"#FFDBC1"},
          {icon:"child_care",val:diapers.length,sub:"חיתולים",color:"#7FC09C",bg:"#D7F3E3",border:"#A8DDD5"},
          {icon:"bedtime",val:totalSlMs?dur(totalSlMs):sleeps.length,sub:"שינה",color:"#C9A000",bg:"#FFF3C2",border:"#F4D03F"},
        ].map(s=>`
          <div style="background:${isNight?"rgba(255,255,255,0.07)":"#fff"};border-radius:20px;padding:14px 6px;border:2px solid ${isNight?"rgba(255,255,255,0.08)":"#F5EFEA"};box-shadow:${isNight?"none":"0 6px 0px rgba(216,199,188,0.25)"};text-align:center">
            <div style="display:flex;justify-content:center;margin-bottom:6px">
              <div style="background:${s.bg};border-radius:12px;padding:8px;border:2px solid ${s.border}">${ms(s.icon,1,18,s.color)}</div>
            </div>
            <div style="font-size:20px;font-weight:700;color:${tp};font-family:'Quicksand',sans-serif">${s.val}</div>
            <div style="font-size:10px;color:${ts};font-weight:700">${s.sub}</div>
          </div>
        `).join("")}
      </div>`;

    // Bento Quick Actions
    const bento=`

function renderLogItem(l,catIcons){
  const c=CAT[l.type];
  const types=l.type==="feed"&&l.subtype?l.subtype.split(",").filter(Boolean):[];
  const diaperLabel=DIAPER_TYPES.find(d=>d.value===l.subtype)?.label;

  // Build detail lines
  let detailLines=[];
  if(l.type==="feed"){
    if(types.length>1){
      // one line per type
      types.forEach(t=>{
        const ft=FEED_TYPES.find(f=>f.value===t);
        const m=l.mlByType?.[t];
        detailLines.push(`<span style="display:block">${ft?.label||t}${m?` — <strong style="color:${c.accent}">${m} מ״ל</strong>`:""}</span>`);
      });
    } else {
      const ft=types[0]?FEED_TYPES.find(f=>f.value===types[0]):null;
      let line=ft?.label||"";
      if(l.ml) line+=` — <strong style="color:${c.accent}">${l.ml} מ״ל</strong>`;
      else if(l.amount) line+=` — ${l.amount}${types[0]?.includes("breast")?" דק׳":" מ״ל"}`;
      if(line) detailLines.push(line);
    }
  } else if(diaperLabel){
    detailLines.push(diaperLabel);
  } else if(l.medName){
    detailLines.push(l.medName+(l.medDose?` — ${l.medDose}`:""));
  }
  if(l.durationMs>0) detailLines.push(dur(l.durationMs));
  if(l.note) detailLines.push(`<em>${l.note}</em>`);

  const dateStr=new Date(l.ts).toLocaleDateString("he-IL",{day:"numeric",month:"numeric"});
  return`
    <div style="display:flex;align-items:flex-start;gap:9px;padding:10px 11px;border-radius:8px;background:${c.bg};margin-bottom:6px;border:1px solid ${c.border}">
      <div style="flex-shrink:0;background:#fff;border-radius:6px;padding:6px;border:1px solid ${c.border};margin-top:2px">${svgIcon(catIcons[l.type]||ICONS.note,16,c.accent)}</div>
      <div data-action="view-log" data-id="${l.id}" style="flex:1;min-width:0;cursor:pointer">
        <div style="font-weight:700;font-size:12px;color:${c.accent}">${c.label}</div>
        <div style="font-size:11px;color:${T.slate};margin-top:2px;line-height:1.6">${detailLines.join("")}</div>
      </div>
      <div style="text-align:center;flex-shrink:0;min-width:40px">
        <div style="font-size:12px;font-weight:800;color:${c.accent}">${fmtTime(l.ts)}</div>
        <div style="font-size:9px;color:${T.muted}">${dateStr}</div>
      </div>
      <button data-action="open-edit" data-id="${l.id}" style="background:#fff;border:1px solid ${c.border};border-radius:6px;width:28px;height:28px;font-size:13px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:${c.accent}">✏️</button>
      <button data-action="delete-log" data-id="${l.id}" style="background:rgba(255,255,255,0.8);border:1px solid ${c.border};border-radius:6px;width:28px;height:28px;font-size:12px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:${T.muted}">✕</button>
    </div>`;
}

function showLogView(l){
  const c=CAT[l.type];
  const types=l.type==="feed"&&l.subtype?l.subtype.split(",").filter(Boolean):[];
  const diaperLabel=DIAPER_TYPES.find(d=>d.value===l.subtype)?.label;
  let rows=[];
  if(l.type==="feed"){
    if(types.length>1){
      types.forEach(t=>{
        const ft=FEED_TYPES.find(f=>f.value===t);
        const m=l.mlByType?.[t];
        rows.push({k:ft?.label||t,v:m?`${m} מ״ל`:"—"});
      });
      if(l.ml) rows.push({k:"סה״כ",v:`${l.ml} מ״ל`});
    } else {
      const ft=types[0]?FEED_TYPES.find(f=>f.value===types[0]):null;
      if(ft) rows.push({k:"סוג",v:ft.label});
      if(l.ml) rows.push({k:"כמות",v:`${l.ml} מ״ל`});
      else if(l.amount) rows.push({k:"משך",v:`${l.amount} ${types[0]?.includes("breast")?"דק׳":"מ״ל"}`});
    }
  } else if(l.type==="diaper"){
    rows.push({k:"סוג",v:diaperLabel||l.subtype});
  } else if(l.type==="med"){
    if(l.medName) rows.push({k:"תרופה",v:l.medName});
    if(l.medDose) rows.push({k:"מינון",v:l.medDose});
  } else if(l.type==="sleep"){
    if(l.durationMs>0) rows.push({k:"משך",v:dur(l.durationMs)});
  }
  rows.push({k:"שעה",v:fmtTime(l.ts)});
  rows.push({k:"תאריך",v:new Date(l.ts).toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long"})});
  if(l.note) rows.push({k:"הערה",v:l.note});

  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;background:rgba(10,30,60,0.5);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px";
  ov.innerHTML=`
    <div style="background:#fff;border-radius:16px;width:100%;max-width:320px;direction:rtl;font-family:'Nunito',sans-serif;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.18)">
      <div style="background:${c.bg};padding:14px 18px;border-bottom:1px solid ${c.border};display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:16px;font-weight:800;color:${c.accent}">${c.label}</span>
        <button id="vl-close" style="background:rgba(255,255,255,0.7);border:1px solid ${c.border};border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:14px;color:${T.muted}">✕</button>
      </div>
      <div style="padding:16px 18px">
        ${rows.map(r=>`
          <div style="display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid #f0f4f8">
            <span style="font-size:12px;color:${T.muted};font-weight:700">${r.k}</span>
            <span style="font-size:13px;font-weight:800;color:${T.slate}">${r.v}</span>
          </div>`).join("")}
      </div>
    </div>`;
  document.body.appendChild(ov);
  document.getElementById("vl-close").onclick=()=>ov.remove();
  ov.addEventListener("click",e=>{if(e.target===ov)ov.remove();});
}

function groupByDay(logs){
  // sort all logs by ts descending first
  const sorted=[...logs].sort((a,b)=>Number(b.ts)-Number(a.ts));
  const days={};
  sorted.forEach(l=>{
    const d=new Date(Number(l.ts));
    d.setHours(0,0,0,0);
    const key=d.getTime();
    if(!days[key])days[key]={ts:key,logs:[]};
    days[key].logs.push(l);
  });
  const today=new Date();today.setHours(0,0,0,0);
  const yday=new Date(today);yday.setDate(yday.getDate()-1);
  return Object.values(days).sort((a,b)=>b.ts-a.ts).map(d=>{
    // sort logs within day: newest first
    d.logs.sort((a,b)=>Number(b.ts)-Number(a.ts));
    const isToday=d.ts===today.getTime();
    const isYday=d.ts===yday.getTime();
    const label=isToday?"היום":isYday?"אתמול":new Date(d.ts).toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long"});
    const feeds=d.logs.filter(l=>l.type==="feed");
    const diapers=d.logs.filter(l=>l.type==="diaper");
    const sleeps=d.logs.filter(l=>l.type==="sleep");
    const ml=feeds.reduce((s,l)=>s+(Number(l.ml)||0),0);
    const slMs=sleeps.reduce((s,l)=>s+(l.durationMs||0),0);
    return{...d,label,isToday,isYday,feeds:feeds.length,diapers:diapers.length,sleeps:sleeps.length,ml,slMs};
  });
}

function renderCharts(logs,isNight,ts,C){
  const safeLogs=logs.map(l=>({...l,ts:Number(l.ts)}));
  const last7=Array.from({length:7},(_,i)=>{
    const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6+i);
    const n=new Date(d);n.setDate(n.getDate()+1);
    const dl=safeLogs.filter(l=>l.ts>=d.getTime()&&l.ts<n.getTime());
    return{day:d.toLocaleDateString("he-IL",{weekday:"short"}),ml:dl.filter(l=>l.type==="feed").reduce((s,l)=>s+(Number(l.ml)||0),0),hrs:+(dl.filter(l=>l.type==="sleep").reduce((s,l)=>s+(l.durationMs||0),0)/3600000).toFixed(1),diapers:dl.filter(l=>l.type==="diaper").length};
  });
  const hasData=last7.some(d=>d.ml>0||d.hrs>0||d.diapers>0);
  if(!hasData)return`<div style="${C()}text-align:center;padding:32px 0;color:${ts}"><div style="font-size:32px;margin-bottom:10px">📊</div><div style="font-weight:700;font-size:14px">עדיין אין מספיק נתונים</div><div style="font-size:12px;margin-top:4px">הגרפים יופיעו אחרי כמה רישומים</div></div>`;
  return[
    {key:"ml",label:'מ״ל האכלה',unit:'מ"ל',color:T.blue,type:"bar",icon:ICONS.bottle},
    {key:"hrs",label:"שעות שינה",unit:"שע׳",color:"#5B6FA6",type:"line",icon:ICONS.moon},
    {key:"diapers",label:"חיתולים",unit:"",color:T.teal,type:"bar",icon:ICONS.diaper},
  ].map(ch=>{
    const data=last7.map(d=>({day:d.day,val:d[ch.key]}));
    const max=Math.max(...data.map(d=>d.val),1);
    const W=300,H=88,PAD=14,gap=4,bw=(W-gap*(data.length+1))/data.length;
    let svg="";
    if(ch.type==="bar"){
      svg=data.map((d,i)=>{
        const bh=Math.max((d.val/max)*(H-PAD),d.val>0?3:0),x=gap+i*(bw+gap),y=H-bh;
        return`<rect x="${x}" y="${d.val>0?y:H}" width="${bw}" height="${d.val>0?bh:2}" rx="3" fill="${d.val>0?ch.color:"#E0EDF7"}"/>
          ${d.val>0?`<text x="${x+bw/2}" y="${y-3}" text-anchor="middle" font-size="9" fill="${ch.color}" font-weight="700">${d.val}</text>`:""}
          <text x="${x+bw/2}" y="${H+16}" text-anchor="middle" font-size="10" fill="${T.muted}">${d.day}</text>`;
      }).join("");
    }else{
      const padX=14,pts=data.map((d,i)=>({x:padX+i*(W-padX*2)/(data.length-1||1),y:PAD+(1-(d.val/max))*(H-PAD),val:d.val,day:d.day}));
      svg=`<path d="${pts.map((p,i)=>`${i===0?"M":"L"}${p.x},${p.y}`).join(" ")}" fill="none" stroke="${ch.color}" stroke-width="2" stroke-linejoin="round"/>`;
      svg+=pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="${ch.color}"/>${p.val>0?`<text x="${p.x}" y="${p.y-8}" text-anchor="middle" font-size="9" fill="${ch.color}" font-weight="700">${p.val}</text>`:""}<text x="${p.x}" y="${H+16}" text-anchor="middle" font-size="10" fill="${T.muted}">${p.day}</text>`).join("");
    }
    return`<div style="${C()}"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="display:flex;align-items:center;gap:6px">${svgIcon(ch.icon,14,isNight?"rgba(255,255,255,0.5)":T.muted)}<span style="font-size:12px;font-weight:700;color:${ts}">${ch.label} — 7 ימים</span></div><span style="font-size:13px;font-weight:800;color:${ch.color}">${last7[6][ch.key]} ${ch.unit} היום</span></div><svg viewBox="0 0 ${W} ${H+24}" style="width:100%">${svg}</svg></div>`;
  }).join("");
}

function mlPicker(id,val,accent){
  const v=Math.round((val||0)/5)*5;
  const opts=[];
  for(let i=0;i<=200;i+=5)opts.push(`<option value="${i}"${i===v?" selected":""}>${i} מ״ל</option>`);
  // use onchange to keep value in sync, and data-val for JS setting
  return`<div style="margin-bottom:14px">
    <label style="display:block;margin-bottom:6px;font-size:12px;color:#8FA3B8;font-weight:700">כמה שתה (מ״ל)</label>

    </select>
  </div>`;
}

// ── Events ─────────────────────────────────────────────────────────────────
let _eventsAttached=false;
function attachEvents(){
  // attach global delegation once only
  if(!_eventsAttached){
    document.addEventListener("click",e=>{
      // handle edit feed/diaper type buttons
      const feedBtn=e.target.closest("[data-edit-feed]");
      if(feedBtn&&state.editingLog){
        const val=feedBtn.dataset.editFeed;
        const cur=(state.editingLog.subtype||"").split(",").filter(Boolean);
        const next=cur.includes(val)?cur.filter(t=>t!==val):[...cur,val];
        setState({editingLog:{...state.editingLog,subtype:next.join(",")}});
        return;
      }
      const diaperBtn=e.target.closest("[data-edit-diaper]");
      if(diaperBtn&&state.editingLog){
        setState({editingLog:{...state.editingLog,subtype:diaperBtn.dataset.editDiaper}});
        return;
      }
      // view-log — handle before generic data-action
      const vl=e.target.closest("[data-action='view-log']");
      if(vl){
        const lid=vl.dataset.id;
        const log=state.logs.find(l=>String(l.id)===lid);
        if(log){showLogView(log);}
        return;
      }
      const el=e.target.closest("[data-action]");
      if(el)handleAction(e,el);
    });
    _eventsAttached=true;
  }
  const ni=document.getElementById("new-baby-name");if(ni)ni.addEventListener("input",e=>state.newBabyName=e.target.value);
  const di=document.getElementById("new-baby-dob");if(di)di.addEventListener("input",e=>state.newBabyDob=e.target.value);
  const de=document.getElementById("dob-edit-input");if(de)de.addEventListener("input",e=>state.dobInput=e.target.value);
  // force-set select values (mobile browsers sometimes ignore selected attribute in innerHTML)
  document.querySelectorAll("select[data-val]").forEach(s=>{
    s.value=s.dataset.val;
  });
  const spi=document.getElementById("selector-photo-input");
  if(spi)spi.addEventListener("change",e=>{
    const file=e.target.files[0];
    const babyId=spi.dataset.babyId;
    if(!file||!babyId)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement("canvas");
        const max=300;
        const ratio=Math.min(max/img.width,max/img.height,1);
        canvas.width=img.width*ratio;
        canvas.height=img.height*ratio;
        canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
        const compressed=canvas.toDataURL("image/jpeg",0.8);
        saveBabyPhoto(babyId,compressed);
        // update in-memory babies list
        const b=state.babies.find(x=>x.id===babyId);
        if(b)b.photoData=compressed;
        setState({});
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value="";
  });
  const pi=document.getElementById("photo-input");
  if(pi)pi.addEventListener("change",e=>{
    const file=e.target.files[0];
    if(!file||!state.selectedBaby)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      // compress image before saving
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement("canvas");
        const max=300;
        const ratio=Math.min(max/img.width,max/img.height,1);
        canvas.width=img.width*ratio;
        canvas.height=img.height*ratio;
        canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
        const compressed=canvas.toDataURL("image/jpeg",0.8);
        saveBabyPhoto(state.selectedBaby.id,compressed);
        setState({});// trigger re-render
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value="";// reset so same file can be picked again
  });
}

// ── Custom confirm dialog ──────────────────────────────────────────────────
function btConfirm(msg, yesLabel, onYes, danger=true){
  const overlay=document.createElement("div");
  overlay.id="bt-confirm";
  overlay.innerHTML=`
    <div id="bt-confirm-box">
      <div id="bt-confirm-msg">${msg}</div>
      <div id="bt-confirm-btns">
        <button id="bt-confirm-no" style="pointer-events:auto">ביטול</button>
        <button id="bt-confirm-yes" style="background:${danger?"#F06292":"#FF9F66"};color:#fff;pointer-events:auto;border-radius:10px">${yesLabel}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById("bt-confirm-yes").onclick=()=>{overlay.remove();onYes();};
  document.getElementById("bt-confirm-no").onclick=()=>overlay.remove();
  overlay.addEventListener("click",e=>{if(e.target===overlay)overlay.remove();});
}


function handleAction(e,el){
  el=el||e.currentTarget;
  const action=el.dataset.action;
  e.stopPropagation();

  if(action==="sync-refresh"){init();return;}

  if(action==="select-baby"){
    const baby=state.babies.find(b=>b.id===el.dataset.id);
    if(!baby)return;
    setState({screen:"dashboard",selectedBaby:baby,logs:[],tab:"home",modal:null,isNight:null,dobInput:baby.dob||"",syncStatus:"busy"});
    sb.getLogs(baby.id).then(rows=>{
      const logs=rows.map(rowToLog);
      store.saveLogs(baby.id,logs);
      setState({logs,syncStatus:"ok"});
    }).catch(()=>{
      setState({logs:store.getLogs(baby.id),syncStatus:"err"});
    });
  }
  else if(action==="delete-baby"){
    const id=el.dataset.id;
    const baby=state.babies.find(b=>b.id===id);
    btConfirm(`למחוק את ${baby?.name||"התינוק"} וכל הנתונים שלו?`,"מחק",()=>{
      setSyncStatus("busy");
      sb.deleteLogs(id).then(()=>sb.deleteBaby(id)).then(()=>{
        const babies=state.babies.filter(b=>b.id!==id);
        store.saveBabies(babies);
        setState({babies,syncStatus:"ok"});
      }).catch(()=>{
        const babies=state.babies.filter(b=>b.id!==id);
        store.saveBabies(babies);
        setState({babies,syncStatus:"err"});
      });
    });
  }
  else if(action==="start-add")setState({addingBaby:true});
  else if(action==="cancel-add")setState({addingBaby:false,newBabyName:"",newBabyEmoji:"☁️",newBabyDob:""});
  else if(action==="pick-emoji")setState({newBabyEmoji:el.dataset.emoji});
  else if(action==="confirm-add"){
    if(!state.newBabyName.trim())return;
    const baby={id:Date.now().toString(),name:state.newBabyName.trim(),emoji:state.newBabyEmoji,dob:state.newBabyDob,createdAt:Date.now()};
    const babies=[...state.babies,baby];
    store.saveBabies(babies);
    setState({babies,screen:"dashboard",selectedBaby:baby,logs:[],tab:"home",modal:null,isNight:null,addingBaby:false,newBabyName:"",newBabyEmoji:"☁️",newBabyDob:"",dobInput:baby.dob||"",syncStatus:"busy"});
    sb.upsertBaby(babyToRow(baby)).then(()=>setSyncStatus("ok")).catch(()=>setSyncStatus("err"));
  }
  else if(action==="go-back"){clearInterval(sleepTimer);clearInterval(feedTimer);setState({screen:"selector",selectedBaby:null,logs:[],modal:null});}
  else if(action==="pick-photo"){
    const inp=document.getElementById("photo-input");
    if(inp)inp.click();
  }
  else if(action==="selector-pick-photo"){
    const babyId=el.dataset.id;
    const inp=document.getElementById("selector-photo-input");
    if(inp){inp.dataset.babyId=babyId;inp.click();}
  }
  else if(action==="toggle-night"){
    const _autoNight=new Date().getHours()>=21||new Date().getHours()<6;
    setState({isNight:!(state.isNight!==null?state.isNight:_autoNight)});
  }
  else if(action==="set-tab")setState({tab:el.dataset.tab});
  else if(action==="open-modal"){
    clearInterval(sleepTimer);clearInterval(feedTimer);
    setState({modal:el.dataset.type,feedType:[],amount:"",ml:"",diaperType:"wet",medName:"",medDose:"",note:"",sleeping:false,sleepStart:null,elapsed:0,timerMs:null,feedRunning:false,feedStart:null,feedEl:0});
  }
  else if(action==="close-modal"){
    btConfirm("לסגור ולבטל את הרישום?","סגור",()=>{
      clearInterval(sleepTimer);clearInterval(feedTimer);
      setState({modal:null,_voiceMl:null});
    },false);
  }
  else if(action==="save-log")saveLog();
  else if(action==="delete-log"){
    const lid=el.dataset.id;
    btConfirm("למחוק רשומה זו?","מחק",()=>{
      const logs=state.logs.filter(l=>String(l.id)!==lid);
      store.saveLogs(state.selectedBaby.id,logs);
      setState({logs,syncStatus:"busy"});
      sb.deleteLog(lid).then(()=>setSyncStatus("ok")).catch(()=>setSyncStatus("err"));
    });
  }
  else if(action==="start-voice"){startVoice();}
  else if(action==="export-sheets")exportToSheets(state.logs,state.selectedBaby.name);
  else if(action==="clear-logs"){
    btConfirm("למחוק את כל הנתונים של "+state.selectedBaby.name+"?","מחק הכל",()=>{
      store.saveLogs(state.selectedBaby.id,[]);
      setState({logs:[],syncStatus:"busy"});
      sb.deleteLogs(state.selectedBaby.id).then(()=>setSyncStatus("ok")).catch(()=>setSyncStatus("err"));
    });
  }
  else if(action==="edit-dob")setState({editDob:true,dobInput:state.selectedBaby.dob||""});
  else if(action==="cancel-dob")setState({editDob:false});
  else if(action==="save-dob"){
    const baby={...state.selectedBaby,dob:state.dobInput};
    const babies=state.babies.map(b=>b.id===baby.id?baby:b);
    store.saveBabies(babies);
    setState({selectedBaby:baby,babies,editDob:false,syncStatus:"busy"});
    sb.upsertBaby(babyToRow(baby)).then(()=>setSyncStatus("ok")).catch(()=>setSyncStatus("err"));
  }
  else if(action==="set-feed-type"){
    const val=el.dataset.val;
    const cur=Array.isArray(state.feedType)?state.feedType:[state.feedType].filter(Boolean);
    const newTypes=cur.includes(val)?cur.filter(t=>t!==val):[...cur,val];
    setState({feedType:newTypes,feedRunning:false,feedStart:null,feedEl:0,timerMs:null});
  }
  else if(action==="feed-timer-start"){
    const s=Date.now();state.feedStart=s;state.feedRunning=true;
    clearInterval(feedTimer);
    feedTimer=setInterval(()=>setState({feedEl:Date.now()-state.feedStart}),1000);
    setState({feedRunning:true});
  }
  else if(action==="feed-timer-pause"){clearInterval(feedTimer);setState({feedRunning:false});}
  else if(action==="feed-timer-resume"){
    const offset=state.feedEl,now=Date.now();
    state.feedStart=now-offset;
    clearInterval(feedTimer);
    feedTimer=setInterval(()=>setState({feedEl:Date.now()-state.feedStart}),1000);
    setState({feedRunning:true});
  }
  else if(action==="feed-timer-done"){
    clearInterval(feedTimer);
    const ms=state.feedEl;
    setState({feedRunning:false,timerMs:ms,amount:String(Math.round(ms/60000))});
  }
  else if(action==="sleep-start"){
    const s=Date.now();state.sleepStart=s;
    clearInterval(sleepTimer);
    sleepTimer=setInterval(()=>setState({elapsed:Date.now()-state.sleepStart}),1000);
    setState({sleeping:true});
  }
  else if(action==="sleep-stop"){clearInterval(sleepTimer);setState({sleeping:false});}
  else if(action==="set-diaper-type")setState({diaperType:el.dataset.val});
  else if(action==="open-edit"){
    const lid=el.dataset.id;
    const log=state.logs.find(l=>String(l.id)===lid);
    if(log)setState({editingLog:{...log,id:String(log.id)}});
  }
  else if(action==="close-edit")setState({editingLog:null});
  else if(action==="save-edit"){
    const lid=el.dataset.id;
    const orig=state.logs.find(l=>String(l.id)===lid);
    if(!orig)return;
    const editL=state.editingLog||orig;
    const tsEl=document.getElementById("edit-ts");
    const noteEl=document.getElementById("edit-note");
    const newTs=tsEl&&tsEl.value?parseLocalDt(tsEl.value):orig.ts;
    const note=noteEl?noteEl.value:orig.note;
    let updated={...orig,ts:isNaN(newTs)?orig.ts:newTs,note};
    if(orig.type==="feed"){
      const types=(editL.subtype||"").split(",").filter(Boolean);
      let amount=null,ml=null,mlByType={};
      if(types.length<=1){
        const amtEl=document.getElementById("edit-amount-0");
        const mlEl=document.getElementById("edit-ml-0");
        amount=amtEl?.value?Number(amtEl.value):orig.amount;
        ml=mlEl?.value?Number(mlEl.value):orig.ml;
      } else {
        types.forEach((t,i)=>{
          const amtEl=document.getElementById("edit-amount-"+i);
          const mlEl=document.getElementById("edit-ml-"+i);
          const m=mlEl?.value?Number(mlEl.value):null;
          if(m)mlByType[t]=m;
          if(amtEl?.value&&!amount)amount=Number(amtEl.value);
        });
        ml=Object.values(mlByType).reduce((s,v)=>s+v,0)||null;
      }
      updated.subtype=editL.subtype||orig.subtype;
      updated.amount=amount;
      updated.ml=ml;
      updated.mlByType=Object.keys(mlByType).length?mlByType:null;
    } else if(orig.type==="diaper"){
      updated.subtype=editL.subtype||orig.subtype;
    } else if(orig.type==="med"){
      const mnEl=document.getElementById("edit-med-name");
      const mdEl=document.getElementById("edit-med-dose");
      updated.medName=mnEl?mnEl.value:orig.medName;
      updated.medDose=mdEl?mdEl.value:orig.medDose;
    } else if(orig.type==="sleep"){
      const slEl=document.getElementById("edit-sleep");
      updated.durationMs=slEl&&slEl.value?Number(slEl.value)*60000:orig.durationMs;
    }
    const logs=state.logs.map(l=>String(l.id)===lid?updated:l);
    store.saveLogs(state.selectedBaby.id,logs);
    setState({logs,editingLog:null,syncStatus:"busy"});
    sb.upsertLog(logToRow(updated,state.selectedBaby.id)).then(()=>setSyncStatus("ok")).catch(()=>setSyncStatus("err"));
  }
  else if(action==="toggle-day"){
    const day=el.dataset.day;
    const openDays={...state.openDays,[day]:!state.openDays[day]};
    setState({openDays});
  }
  else if(action==="edit-time")setState({editingTimeId:el.dataset.id});
  else if(action==="cancel-time")setState({editingTimeId:null});
  else if(action==="save-time"){
    const lid=el.dataset.id;
    const input=document.getElementById("time-edit-"+lid);
    if(!input)return;
    const newTs=parseLocalDt(input.value);
    if(isNaN(newTs))return;
    const logs=state.logs.map(l=>String(l.id)===lid?{...l,ts:newTs}:l);
    store.saveLogs(state.selectedBaby.id,logs);
    setState({logs,editingTimeId:null,syncStatus:"busy"});
    const updated=logs.find(l=>String(l.id)===lid);
    if(updated)sb.upsertLog(logToRow(updated,state.selectedBaby.id)).then(()=>setSyncStatus("ok")).catch(()=>setSyncStatus("err"));
  }
}

function saveLog(){
  const amtEl=document.getElementById("modal-amount");
  const mlEl=document.getElementById("modal-ml");
  const noteEl=document.getElementById("modal-note");
  const medNameEl=document.getElementById("modal-med-name");
  const medDoseEl=document.getElementById("modal-med-dose");
  const tsEl=document.getElementById("modal-ts");
  if(amtEl)state.amount=amtEl.value;
  if(mlEl)state.ml=mlEl.value;
  if(noteEl)state.note=noteEl.value;
  if(medNameEl)state.medName=medNameEl.value;
  if(medDoseEl)state.medDose=medDoseEl.value;

  // parse datetime-local as local time (not UTC)
  const customTs=tsEl&&tsEl.value?parseLocalDt(tsEl.value):null;
  const ts=(customTs&&!isNaN(customTs))?customTs:Date.now();

  if(state.modal==="sleep"&&!state.sleepStart&&!state.elapsed){alert("לחץ על 'התחל להקליט שינה' קודם");return;}

  const id=String(Date.now()+Math.random());
  const base={type:state.modal,ts,note:state.note,id};
  let log;
  if(state.modal==="feed"){
    const types=Array.isArray(state.feedType)?state.feedType:(state.feedType?[state.feedType]:[]);
    const ft=types.join(",");
    let amount=null,ml=null,mlByType={};
    if(types.length<=1){
      const amtEl=document.getElementById("modal-amount");
      const mlEl=document.getElementById("modal-ml");
      if(amtEl)amount=amtEl.value!==""?Number(amtEl.value):null;
      if(mlEl)ml=mlEl.value!==""?parseInt(mlEl.value):null;
    } else {
      types.forEach((t,i)=>{
        const amtEl=document.getElementById("modal-amount-"+i);
        const mlEl=document.getElementById("modal-ml-"+i);
        const a=amtEl?.value!==""?Number(amtEl.value):null;
        const m=mlEl?.value!==""?parseInt(mlEl.value):null;
        if(m!==null)mlByType[t]=m;
        if(a&&!amount)amount=a;
      });
      ml=Object.values(mlByType).reduce((s,v)=>s+v,0)||null;
    }
    log={...base,subtype:ft,amount,ml,mlByType:Object.keys(mlByType).length?mlByType:null,durationMs:state.timerMs||null};
  }
  else if(state.modal==="diaper")log={...base,subtype:state.diaperType};
  else if(state.modal==="sleep"){
    const finalMs=state.sleeping?Date.now()-state.sleepStart:state.elapsed;
    clearInterval(sleepTimer);
    log={...base,subtype:"tracked",durationMs:finalMs};
  }
  else if(state.modal==="med")log={...base,medName:state.medName,medDose:state.medDose};
  else log=base;

  clearInterval(feedTimer);
  const logs=[log,...state.logs];
  store.saveLogs(state.selectedBaby.id,logs);
  setState({logs,modal:null,_voiceMl:null,sleeping:false,sleepStart:null,elapsed:0,feedRunning:false,feedStart:null,feedEl:0,syncStatus:"busy"});

  sb.upsertLog(logToRow(log,state.selectedBaby.id))
    .then(()=>setSyncStatus("ok"))
    .catch(()=>setSyncStatus("err"));
}

// ── Voice Recognition ──────────────────────────────────────────────────────
const HEB_NUMS={
  "אפס":0,"אחת":1,"אחד":1,"שתיים":2,"שניים":2,"שלוש":3,"שלושה":3,
  "ארבע":4,"ארבעה":4,"חמש":5,"חמישה":5,"שש":6,"ששה":6,
  "שבע":7,"שבעה":7,"שמונה":8,"תשע":9,"תשעה":9,"עשר":10,"עשרה":10,
  "אחת עשרה":11,"אחד עשר":11,"שתיים עשרה":12,"שנים עשר":12,
  "שלוש עשרה":13,"ארבע עשרה":14,"חמש עשרה":15,"שש עשרה":16,
  "שבע עשרה":17,"שמונה עשרה":18,"תשע עשרה":19,"עשרים":20,
  "שלושים":30,"ארבעים":40,"חמישים":50,"שישים":60,"שבעים":70,
  "שמונים":80,"תשעים":90,"מאה":100,"מאה ועשרים":120,"מאה וחמישים":150,
  "מאה ושמונים":180,"מאתיים":200
};

function parseHebNum(str){
  str=str.trim().toLowerCase();
  if(HEB_NUMS[str]!==undefined)return HEB_NUMS[str];
  // try digit
  const n=parseInt(str);
  if(!isNaN(n))return n;
  // try compound: "שמונים ועשר" = 90
  for(const[k,v] of Object.entries(HEB_NUMS)){
    if(str.includes(k)){
      str=str.replace(k,"").trim();
      const rest=parseHebNum(str);
      return rest?v+rest:v;
    }
  }
  return null;
}

function parseHebHour(str){
  // returns {h, needAmPm} or null
  const patterns=[
    {re:/שעה\s+(\S+(?:\s+\S+)?)/,g:1},
    {re:/בשעה\s+(\S+(?:\s+\S+)?)/,g:1},
  ];
  for(const p of patterns){
    const m=str.match(p.re);
    if(m){
      const word=m[p.g];
      const h=parseHebNum(word.split(/\s+ו|\s+ב/)[0]);
      if(h!==null&&h>=0&&h<=23)return{h,needAmPm:h>=1&&h<=12};
    }
  }
  return null;
}

function applyAmPm(h,text){
  if(text.includes("בוקר"))return h===12?0:h<=11?h:h;
  if(text.includes("צהריים")||text.includes("אחר הצהריים")||text.includes("אחה״צ")||text.includes("אחה\"צ"))return h===12?12:h<12?h+12:h;
  if(text.includes("ערב"))return h<12&&h!==0?h+12:h;
  if(text.includes("לילה")){
    if(h>=6&&h<=11)return h+12;
    if(h>=1&&h<=5)return h;
    if(h===12)return 0;
    return h;
  }
  return null;
}

function showAmPmDialog(h, onResult){
  const pmH=h>=1&&h<=6?h:h+12>=24?h:h+12; // 1-6 = already night hours
  const amLabel=h===12?"12:00 צהריים":`${String(h).padStart(2,"0")}:00 בוקר`;
  const pmLabel=h>=1&&h<=6?`${String(h).padStart(2,"0")}:00 לילה`:`${String(pmH).padStart(2,"0")}:00 אחה״צ/ערב`;
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;background:rgba(10,30,60,0.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px";
  ov.innerHTML=`
    <div style="background:#fff;border-radius:16px;width:100%;max-width:300px;direction:rtl;font-family:'Nunito',sans-serif;padding:24px 20px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.18)">
      <div style="font-size:28px;margin-bottom:10px">🕐</div>
      <div style="font-weight:800;font-size:16px;color:${T.slate};margin-bottom:6px">שעה ${h} — בוקר או לילה?</div>
      <div style="font-size:13px;color:${T.muted};margin-bottom:20px">לא ניתן לקבוע אוטומטית</div>
      <div style="display:flex;gap:10px">
        <button id="ampm-am" style="flex:1;padding:13px 0;background:${T.bluePale};color:${T.blue};border:1.5px solid ${T.blueLight};border-radius:10px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer">🌅 ${amLabel}</button>
        <button id="ampm-pm" style="flex:1;padding:13px 0;background:${T.lavender};color:#5B6FA6;border:1.5px solid #C5CEEA;border-radius:10px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer">🌙 ${pmLabel}</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  document.getElementById("ampm-am").onclick=()=>{ov.remove();onResult(h===12?12:h);};
  document.getElementById("ampm-pm").onclick=()=>{ov.remove();onResult(pmH);};
}

function parseVoiceCommand(text){
  const t=text.toLowerCase().trim();
  let type=null,subtype=null,ml=null,amount=null,hourInfo=null;

  // detect type
  if(t.includes("האכל")||t.includes("אכל")||t.includes("שתה")||t.includes("הנק")){
    type="feed";
    // detect feed subtypes
    const types=[];
    if(t.includes("חלב שאוב")||t.includes("שאוב")||t.includes("חלב שווה")||t.includes("שווה")||t.includes("חלב שוב")||t.includes("שוב")||t.includes("חלב שאב")||t.includes("שאב")||t.includes("שאוף")||t.includes("שאף"))types.push("expressed");
    if(t.includes("מטרנה")||t.includes("פורמולה")||t.includes("מתרנה")||t.includes("מטרנא"))types.push("formula");
    if(t.includes("הנקה שמאל")||t.includes("שמאל"))types.push("breast_left");
    if(t.includes("הנקה ימין")||t.includes("ימין"))types.push("breast_right");
    if(t.includes("מוצקים"))types.push("solids");
    if(types.length===0)types.push("expressed"); // default
    subtype=types.join(",");
    // detect ml
    const mlMatch=t.match(/(\S+(?:\s+\S+)?)\s*מ[״"']?ל/);
    if(mlMatch)ml=parseHebNum(mlMatch[1]);
    if(!ml){
      // try numbers anywhere
      for(const[k,v] of Object.entries(HEB_NUMS)){
        if(t.includes(k)&&v>0){ml=v;break;}
      }
    }
  } else if(t.includes("חיתול")||t.includes("חית")){
    type="diaper";
    if(t.includes("שניהם")||t.includes("גם"))subtype="both";
    else if(t.includes("מלוכלך")||t.includes("קקי")||t.includes("צואה"))subtype="dirty";
    else subtype="wet"; // default
  }

  if(!type)return null;

  // parse hour
  hourInfo=parseHebHour(t);

  return{type,subtype,ml,amount,hourInfo,text:t};
}

function applyVoiceResult(parsed){
  if(!parsed)return;
  const{type,subtype,ml,hourInfo,text}=parsed;

  function openWithData(ts){
    const voiceMl=ml;
    state.modal=type;
    state.feedType=type==="feed"?(subtype?subtype.split(","):[]):[];
    state.ml=voiceMl?String(voiceMl):"";
    state._voiceMl=voiceMl||null; // dedicated field never reset by other actions
    state.amount="";
    state.diaperType=type==="diaper"?(subtype||"wet"):"wet";
    state.note="";
    state.sleeping=false;state.sleepStart=null;state.elapsed=0;state.timerMs=null;
    state.feedRunning=false;state.feedStart=null;state.feedEl=0;
    state.voiceTs=ts||null;
    render();
    const fillAll=()=>{
      const inp=document.getElementById("modal-ts");
      if(inp&&ts)inp.value=localDtStr(ts);
      const v=state._voiceMl;
      if(type==="feed"&&v){
        const snapped=Math.round(v/5)*5; // snap to nearest 5
        const s=document.getElementById("modal-ml");
        if(s)s.value=String(snapped);
        for(let i=0;i<5;i++){
          const f=document.getElementById("modal-ml-"+i);
          if(f)f.value=String(snapped);
        }
      }
    };
    requestAnimationFrame(()=>requestAnimationFrame(fillAll));
    setTimeout(fillAll,300);
  }

  if(hourInfo){
    const resolved=applyAmPm(hourInfo.h,text);
    if(resolved!==null){
      const d=new Date();d.setHours(resolved,0,0,0);
      openWithData(d.getTime());
    } else if(hourInfo.needAmPm){
      showAmPmDialog(hourInfo.h,h=>{
        const d=new Date();d.setHours(h,0,0,0);
        openWithData(d.getTime());
      });
    } else {
      const d=new Date();d.setHours(hourInfo.h,0,0,0);
      openWithData(d.getTime());
    }
  } else {
    openWithData(null); // use current time
  }
}

function showVoiceUI(status,transcript=""){
  let el=document.getElementById("voice-overlay");
  if(!el){
    el=document.createElement("div");
    el.id="voice-overlay";
    el.style.cssText="position:fixed;inset:0;background:rgba(10,30,60,0.6);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px";
    // stop all clicks from reaching app below
    el.addEventListener("click",e=>e.stopPropagation());
    document.body.appendChild(el);
  }
  const colors={listening:"#FF9F66",processing:"#F07840",error:"#F06292",done:"#7FC09C"};
  const labels={listening:"מקשיב...",processing:"מעבד...",error:"לא הצלחתי להבין",done:"הבנתי!"};
  el.innerHTML=`
    <div style="background:#fff;border-radius:20px;width:100%;max-width:300px;direction:rtl;font-family:'Nunito',sans-serif;padding:28px 20px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.2)">
      <div style="width:64px;height:64px;border-radius:50%;background:${colors[status]}22;border:3px solid ${colors[status]};margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:28px">
        ${status==="listening"?"🎤":status==="processing"?"⚙️":status==="done"?"✅":"❌"}
      </div>
      <div style="font-size:16px;font-weight:800;color:${colors[status]};margin-bottom:8px">${labels[status]}</div>
      ${transcript?`<div style="font-size:13px;color:${T.muted};margin-bottom:14px;line-height:1.5">"${transcript}"</div>`:""}
      ${status==="error"?`<button onclick="document.getElementById('voice-overlay').remove()" style="background:${T.blue};color:#fff;border:none;border-radius:10px;padding:11px 24px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer">סגור</button>`:""}
    </div>`;
  if(status==="done"||status==="error"){
    setTimeout(()=>{const e=document.getElementById("voice-overlay");if(e)e.remove();},1500);
  }
}

function startVoice(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    alert("הדפדפן שלך לא תומך בזיהוי קולי. נסה Chrome.");
    return;
  }
  const rec=new SpeechRecognition();
  rec.lang="he-IL";
  rec.interimResults=false;
  rec.maxAlternatives=3;

  showVoiceUI("listening");

  rec.onresult=e=>{
    const transcript=e.results[0][0].transcript;
    showVoiceUI("processing",transcript);
    setTimeout(()=>{
      const parsed=parseVoiceCommand(transcript);
      if(parsed){
        showVoiceUI("done",transcript);
        setTimeout(()=>{
          // remove overlay first, stopPropagation so no click leaks
          const ov=document.getElementById("voice-overlay");
          if(ov)ov.remove();
          // small delay after removal so DOM settles
          setTimeout(()=>applyVoiceResult(parsed),50);
        },700);
      } else {
        showVoiceUI("error",`"${transcript}" — לא זוהה כהאכלה או חיתול`);
      }
    },400);
  };
  rec.onerror=e=>{
    showVoiceUI("error","לא הצלחתי לשמוע. נסה שוב.");
  };
  rec.onend=()=>{
    const el=document.getElementById("voice-overlay");
    if(el&&el.querySelector(".listening"))el.remove();
  };
  rec.start();
}

// ── PWA Service Worker + Install Banner ───────────────────────────────────
let _deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();
  _deferredPrompt=e;
  showInstallBanner();
});
function showInstallBanner(){
  if(localStorage.getItem("bt_install_dismissed"))return;
  const b=document.createElement("div");
  b.id="install-banner";
  b.style.cssText="position:fixed;bottom:90px;left:50%;transform:translateX(50%);width:calc(100% - 28px);max-width:452px;background:#FF9F66;color:#fff;border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:12px;z-index:999;box-shadow:0 6px 20px rgba(255,159,102,0.35);font-family:'Varela Round',sans-serif;direction:rtl";
  b.innerHTML=`<span style="font-size:26px">🍼</span><div style="flex:1"><div style="font-weight:800;font-size:14px">Baby Tracker</div><div style="font-size:12px;opacity:0.85">הוסף למסך הבית לגישה מהירה</div></div><button onclick="doInstall()" style="background:#fff;color:#2C6BAC;border:none;border-radius:8px;padding:8px 14px;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;cursor:pointer">התקן</button><button onclick="dismissInstall()" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:0 4px">✕</button>`;
  document.body.appendChild(b);
}
function doInstall(){
  if(!_deferredPrompt)return;
  _deferredPrompt.prompt();
  _deferredPrompt.userChoice.then(()=>{_deferredPrompt=null;dismissInstall();});
}
function dismissInstall(){
  localStorage.setItem("bt_install_dismissed","1");
  const b=document.getElementById("install-banner");
  if(b)b.remove();
}
if("serviceWorker" in navigator){
  const sw=`const C="bt-v1";self.addEventListener("install",e=>e.waitUntil(caches.open(C).then(c=>c.add("/"))));self.addEventListener("fetch",e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));`;
  const blob=new Blob([sw],{type:"application/javascript"});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
