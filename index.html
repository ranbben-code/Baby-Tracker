async function sbFetch(path,opts={}){
  const res=await fetch(SB_URL+"/rest/v1/"+path,{
    headers:{
      "apikey":SB_KEY,
      "Authorization":"Bearer "+SB_KEY,
      "Content-Type":"application/json",
      "Prefer":opts.prefer||"return=representation",
      ...(opts.headers||{})
    },
    ...opts
  });
  if(!res.ok){const t=await res.text();throw new Error(t);}
  const t=await res.text();
  return t?JSON.parse(t):[];
}

const fmtTime=ts=>new Date(ts).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"});
const fmtDate=ts=>new Date(ts).toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long"});
const dur=ms=>{const m=Math.floor(ms/60000);return m<60?m+" דק׳":Math.floor(m/60)+":"+String(m%60).padStart(2,"0")+" שע׳"};
const calcAge=dob=>{
  if(!dob)return null;
  const days=Math.floor((Date.now()-new Date(dob))/86400000);
  if(days<7)return days+" ימים";
  const w=Math.floor(days/7),rd=days%7;
  if(w<8)return rd>0?w+" שבועות ו-"+rd+" ימים":w+" שבועות";
  const mo=Math.floor(days/30.44),rmd=Math.floor(days-mo*30.44);
  if(mo<24)return rmd>3?mo+" חודשים ו-"+Math.floor(rmd/7)+" שבועות":mo+" חודשים";
  const y=Math.floor(mo/12),rm=mo%12;
  return rm>0?y+" שנים ו-"+rm+" חודשים":y+" שנים";
};

function exportCSV(logs,name){
  const rows=[["שם","סוג","תת-סוג","מ״ל","משך","שעה","הערה"]];
  logs.forEach(l=>rows.push([name,CAT[l.type]?.label||l.type,l.subtype||"",l.ml||"",l.amount||(l.durationMs?dur(l.durationMs):""),new Date(l.ts).toLocaleString("he-IL"),l.note||""]));
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\uFEFF"+rows.map(r=>r.map(c=>'"'+c+'"').join(",")).join("\n")],{type:"text/csv;charset=utf-8;"}));
  a.download=name+".csv";a.click();
}

async function init(){
  setState({screen:"loading"});
  try{
    const rows=await sb.getBabies();
    const babies=rows.map(rowToBaby);
    store.saveBabies(babies);
    setState({screen:"selector",babies});
  }catch(e){
    // fallback to localStorage
    console.warn("Supabase unavailable, using local:",e);
    setState({screen:"selector",babies:store.getBabies(),syncStatus:"err"});
  }
}

function renderLogItem(l,catIcons){
  const c=CAT[l.type];
  const feedLabel=FEED_TYPES.find(f=>f.value===l.subtype)?.label;
  const diaperLabel=DIAPER_TYPES.find(d=>d.value===l.subtype)?.label;
  let detail="";
  if(feedLabel)detail+=feedLabel;
  if(diaperLabel)detail+=diaperLabel;
  if(l.medName)detail+=l.medName+(l.medDose?" · "+l.medDose:"");
  if(l.ml)detail+=` · <strong style="color:${c.accent}">${l.ml} מ״ל</strong>`;
  else if(l.amount)detail+=" · "+l.amount+(l.subtype?.includes("breast")?" דק׳":" מ״ל");
  if(l.durationMs>0)detail+=" · "+dur(l.durationMs);
  if(l.note)detail+=" · "+l.note;

  const isEditing=state.editingTimeId===String(l.id);
  const dateStr=new Date(l.ts).toLocaleDateString("he-IL",{day:"numeric",month:"numeric"});

  const timeCol=isEditing?`
    <div style="flex-shrink:0;min-width:120px">
      <input id="time-edit-${l.id}" type="datetime-local"
        value="${new Date(l.ts-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)}"
        style="font-size:11px;border:1.5px solid ${c.accent};border-radius:6px;padding:4px 6px;font-family:inherit;width:120px;outline:none"/>
      <div style="display:flex;gap:4px;margin-top:4px">
        <button data-action="save-time" data-id="${l.id}" style="flex:1;background:${c.accent};color:#fff;border:none;border-radius:5px;padding:4px 0;font-family:inherit;font-weight:700;font-size:11px;cursor:pointer">✓</button>
        <button data-action="cancel-time" style="flex:1;background:#f0f0f0;color:${T.muted};border:none;border-radius:5px;padding:4px 0;font-family:inherit;font-weight:700;font-size:11px;cursor:pointer">✕</button>
      </div>
    </div>`:`
    <div style="text-align:center;flex-shrink:0;min-width:48px;cursor:pointer" data-action="edit-time" data-id="${l.id}">
      <div style="font-size:12px;font-weight:800;color:${c.accent}">${fmtTime(l.ts)}</div>
      <div style="font-size:9px;color:${T.muted}">${dateStr}</div>
      <div style="font-size:9px;color:${c.accent};opacity:0.6">✏️</div>
    </div>`;

  return`
    <div style="display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:8px;background:${c.bg};margin-bottom:6px;border:1px solid ${c.border}">
      <div style="flex-shrink:0;background:#fff;border-radius:6px;padding:6px;border:1px solid ${c.border}">${svgIcon(catIcons[l.type]||ICONS.note,16,c.accent)}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:12px;color:${c.accent}">${c.label}</div>
        <div style="font-size:11px;color:${T.slate};margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${detail}</div>
      </div>
      ${timeCol}
      <button data-action="delete-log" data-id="${l.id}" style="background:rgba(255,255,255,0.8);border:1px solid ${c.border};border-radius:6px;width:28px;height:28px;font-size:12px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:${T.muted}">✕</button>
    </div>`;
}

function renderCharts(logs,isNight,ts,C){
  const last7=Array.from({length:7},(_,i)=>{
    const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6+i);
    const n=new Date(d);n.setDate(n.getDate()+1);
    const dl=logs.filter(l=>l.ts>=d.getTime()&&l.ts<n.getTime());
    return{day:d.toLocaleDateString("he-IL",{weekday:"short"}),ml:dl.filter(l=>l.type==="feed").reduce((s,l)=>s+(Number(l.ml)||0),0),hrs:+(dl.filter(l=>l.type==="sleep").reduce((s,l)=>s+(l.durationMs||0),0)/3600000).toFixed(1),diapers:dl.filter(l=>l.type==="diaper").length};
  });
  return[
    {key:"ml",label:'מ״ל האכלה',unit:'מ"ל',color:T.blue,type:"bar",icon:ICONS.bottle},
    {key:"hrs",label:"שעות שינה",unit:"שע׳",color:"#5B6FA6",type:"line",icon:ICONS.moon},
    {key:"diapers",label:"חיתולים",unit:"",color:T.teal,type:"bar",icon:ICONS.diaper},
  ].map(ch=>{
    const data=last7.map(d=>({day:d.day,val:d[ch.key]}));
    const max=Math.max(...data.map(d=>d.val),1);
    const W=300,H=88,gap=4,bw=(W-gap*(data.length+1))/data.length;
    let svg="";
    if(ch.type==="bar"){
      svg=data.map((d,i)=>{
        const bh=Math.max((d.val/max)*H,d.val>0?3:0),x=gap+i*(bw+gap),y=H-bh;
        return`<rect x="${x}" y="${d.val>0?y:H}" width="${bw}" height="${d.val>0?bh:2}" rx="3" fill="${d.val>0?ch.color:"#E0EDF7"}"/>
          ${d.val>0?`<text x="${x+bw/2}" y="${y-3}" text-anchor="middle" font-size="9" fill="${ch.color}" font-weight="700">${d.val}</text>`:""}
          <text x="${x+bw/2}" y="${H+16}" text-anchor="middle" font-size="10" fill="${T.muted}">${d.day}</text>`;
      }).join("");
    }else{
      const padX=14,pts=data.map((d,i)=>({x:padX+i*(W-padX*2)/(data.length-1||1),y:H-(d.val/max)*H,val:d.val,day:d.day}));
      svg=`<path d="${pts.map((p,i)=>`${i===0?"M":"L"}${p.x},${p.y}`).join(" ")}" fill="none" stroke="${ch.color}" stroke-width="2" stroke-linejoin="round"/>`;
      svg+=pts.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="${ch.color}"/>${p.val>0?`<text x="${p.x}" y="${p.y-8}" text-anchor="middle" font-size="9" fill="${ch.color}" font-weight="700">${p.val}</text>`:""}<text x="${p.x}" y="${H+16}" text-anchor="middle" font-size="10" fill="${T.muted}">${p.day}</text>`).join("");
    }
    return`<div style="${C()}"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="display:flex;align-items:center;gap:6px">${svgIcon(ch.icon,14,isNight?"rgba(255,255,255,0.5)":T.muted)}<span style="font-size:12px;font-weight:700;color:${ts}">${ch.label} — 7 ימים</span></div><span style="font-size:13px;font-weight:800;color:${ch.color}">${last7[6][ch.key]} ${ch.unit} היום</span></div><svg viewBox="0 0 ${W} ${H+24}" style="width:100%">${svg}</svg></div>`;
  }).join("");
}

function renderModal(type,isNight){
  const c=CAT[type];
  const catIcon={feed:ICONS.feed,diaper:ICONS.diaper,sleep:ICONS.moon,med:ICONS.med,note:ICONS.note};
  let inner="";
  if(type==="feed"){
    inner=`
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">
        ${FEED_TYPES.map(f=>`<button data-action="set-feed-type" data-val="${f.value}" style="padding:10px 13px;border-radius:6px;border:1.5px solid ${state.feedType===f.value?c.accent:"#C8DAE8"};background:${state.feedType===f.value?c.bg:"#fff"};font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;color:${state.feedType===f.value?c.accent:T.slate}">${f.label}</button>`).join("")}
      </div>
      ${state.feedType.includes("breast")?`
        <div style="background:${c.bg};border-radius:8px;padding:16px;text-align:center;margin-bottom:14px;border:1px solid ${c.accent}30">
          <div style="font-size:44px;font-weight:900;color:${c.accent};letter-spacing:4px;margin-bottom:10px;font-family:monospace">${fmtFeedTimer(state.feedEl)}</div>
          <div style="display:flex;gap:8px;justify-content:center">
            ${!state.feedRunning&&!state.feedStart?`<button data-action="feed-timer-start" style="background:${c.accent};color:#fff;border:none;border-radius:6px;padding:9px 22px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer">▶ התחל</button>`:""}
            ${state.feedRunning?`<button data-action="feed-timer-pause" style="background:${c.accent};color:#fff;border:none;border-radius:6px;padding:9px 22px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer">⏸ השהה</button>`:""}
            ${!state.feedRunning&&state.feedStart?`
              <button data-action="feed-timer-resume" style="background:${c.accent};color:#fff;border:none;border-radius:6px;padding:9px 18px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer">▶ המשך</button>
              <button data-action="feed-timer-done" style="background:#fff;color:${c.accent};border:1.5px solid ${c.accent};border-radius:6px;padding:9px 18px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer">✓ סיים</button>`:""}
          </div>
        </div>`:""}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
        <div>
          <label style="display:block;margin-bottom:5px;font-size:12px;color:${T.muted};font-weight:700">${state.feedType.includes("breast")?"משך (דק׳)":"כמות (מ״ל)"}</label>
          <input id="modal-amount" type="number" inputmode="numeric" value="${state.amount}" placeholder="${state.feedType.includes("breast")?"15":"120"}" style="width:100%;padding:13px 14px;border-radius:6px;border:1.5px solid #C8DAE8;font-size:15px;font-family:inherit;box-sizing:border-box;direction:rtl;outline:none"/>
        </div>
        <div>
          <label style="display:block;margin-bottom:5px;font-size:12px;color:${T.muted};font-weight:700">מ״ל שתה</label>
          <input id="modal-ml" type="number" inputmode="numeric" value="${state.ml}" placeholder="80" style="width:100%;padding:13px 14px;border-radius:6px;border:1.5px solid ${c.accent};font-size:15px;font-family:inherit;box-sizing:border-box;direction:rtl;outline:none"/>
        </div>
      </div>
      <div style="background:${c.bg};border-radius:6px;padding:9px 12px;margin-bottom:14px;font-size:12px;color:${c.accent};font-weight:700;border:1px solid ${c.border};display:flex;align-items:center;gap:6px">
        ${svgIcon(ICONS.clock,13,c.accent)} שעת האכלה: ${new Date().toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"})}
      </div>`;
  }else if(type==="diaper"){
    inner=`<div style="display:flex;gap:8px;margin-bottom:16px">${DIAPER_TYPES.map(d=>`<button data-action="set-diaper-type" data-val="${d.value}" style="flex:1;padding:14px 6px;border-radius:6px;border:1.5px solid ${state.diaperType===d.value?c.accent:"#C8DAE8"};background:${state.diaperType===d.value?c.bg:"#fff"};font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;color:${state.diaperType===d.value?c.accent:T.slate};text-align:center">${d.label}</button>`).join("")}</div>`;
  }else if(type==="sleep"){
    inner=`
      <div style="text-align:center;margin-bottom:20px">
        <div style="display:flex;justify-content:center;margin-bottom:14px">${bearSVG(state.sleeping||!!state.sleepStart,64)}</div>
        ${state.sleeping?`
          <div style="font-size:48px;font-weight:900;color:${c.accent};letter-spacing:3px;margin-bottom:14px;font-family:monospace">
            ${String(Math.floor(state.elapsed/3600000)).padStart(2,"0")}:${String(Math.floor((state.elapsed%3600000)/60000)).padStart(2,"0")}:${String(Math.floor((state.elapsed%60000)/1000)).padStart(2,"0")}
          </div>
          <button data-action="sleep-stop" style="background:${c.accent};color:#fff;border:none;border-radius:6px;padding:13px 0;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;width:100%">⏹ עצור שינה</button>
        `:state.sleepStart?`
          <div style="font-size:15px;color:${T.muted};font-weight:700;padding:12px 0">✓ שינה הוקלטה: ${dur(state.elapsed)}</div>
        `:`
          <button data-action="sleep-start" style="background:${c.accent};color:#fff;border:none;border-radius:6px;padding:14px 0;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;width:100%">▶ התחל להקליט שינה</button>
        `}
      </div>`;
  }else if(type==="med"){
    inner=`
      <div style="margin-bottom:14px">
        <label style="display:block;margin-bottom:5px;font-size:12px;color:${T.muted};font-weight:700">שם התרופה / ויטמין</label>
        <input id="modal-med-name" value="${state.medName}" placeholder="למשל: ויטמין D, נורופן" style="width:100%;padding:13px 14px;border-radius:6px;border:1.5px solid ${c.accent};font-size:15px;font-family:inherit;box-sizing:border-box;direction:rtl;outline:none;margin-bottom:10px"/>
        <label style="display:block;margin-bottom:5px;font-size:12px;color:${T.muted};font-weight:700">מינון</label>
        <input id="modal-med-dose" value="${state.medDose}" placeholder='למשל: 1 מ"ל' style="width:100%;padding:13px 14px;border-radius:6px;border:1.5px solid #C8DAE8;font-size:15px;font-family:inherit;box-sizing:border-box;direction:rtl;outline:none"/>
      </div>`;
  }
  return`
    <div style="position:fixed;inset:0;background:rgba(10,30,60,0.6);z-index:200;display:flex;align-items:flex-end;justify-content:center">
      <div style="background:#F7FBFF;border-radius:14px 14px 0 0;width:100%;max-width:500px;direction:rtl;max-height:92vh;overflow-y:auto">
        <div style="background:${c.bg};border-radius:14px 14px 0 0;padding:16px 18px 14px;border-bottom:1px solid ${c.border}">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div style="display:flex;align-items:center;gap:10px">
              <div style="background:#fff;border-radius:6px;padding:7px;border:1px solid ${c.border}">${svgIcon(catIcon[type],20,c.accent)}</div>
              <span style="font-size:17px;font-weight:800;color:${c.accent}">${c.label}</span>
            </div>
            <button data-action="close-modal" style="background:rgba(255,255,255,0.7);border:1px solid ${c.border};border-radius:6px;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:${T.muted};font-size:15px">✕</button>
          </div>
        </div>
        <div style="padding:18px 18px 40px">
          ${inner}
          <textarea id="modal-note" placeholder="הערה (אופציונלי)..." style="width:100%;padding:13px 14px;border-radius:6px;border:1.5px solid #C8DAE8;font-size:15px;font-family:inherit;box-sizing:border-box;direction:rtl;outline:none;height:68px;resize:none;margin-bottom:14px">${state.note}</textarea>
          <button data-action="save-log" style="background:${c.accent};color:#fff;border:none;border-radius:6px;padding:15px 0;font-family:inherit;font-weight:700;font-size:16px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:7px">
            ${svgIcon(ICONS.save,16,"#fff")} שמור
          </button>
        </div>
      </div>
    </div>`;
}

function fmtFeedTimer(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}

// ── Events ─────────────────────────────────────────────────────────────────
let _eventsAttached=false;
function attachEvents(){
  // attach global delegation once only
  if(!_eventsAttached){
    document.addEventListener("click",e=>{
      const el=e.target.closest("[data-action]");
      if(el)handleAction(e,el);
    });
    _eventsAttached=true;
  }
  const ni=document.getElementById("new-baby-name");if(ni)ni.addEventListener("input",e=>state.newBabyName=e.target.value);
  const di=document.getElementById("new-baby-dob");if(di)di.addEventListener("input",e=>state.newBabyDob=e.target.value);
  const de=document.getElementById("dob-edit-input");if(de)de.addEventListener("input",e=>state.dobInput=e.target.value);
}

function handleAction(e,el){
  el=el||e.currentTarget;
  const action=el.dataset.action;

  if(action==="sync-refresh"){init();return;}

  if(action==="select-baby"){
    const baby=state.babies.find(b=>b.id===el.dataset.id);
    if(!baby)return;
    setState({screen:"dashboard",selectedBaby:baby,logs:[],tab:"home",modal:null,isNight:null,dobInput:baby.dob||"",syncStatus:"busy"});
    sb.getLogs(baby.id).then(rows=>{
      const logs=rows.map(rowToLog);
      store.saveLogs(baby.id,logs);
      setState({logs,syncStatus:"ok"});
    }).catch(()=>{
      setState({logs:store.getLogs(baby.id),syncStatus:"err"});
    });
  }
  else if(action==="delete-baby"){
    if(!confirm("למחוק תינוק זה וכל הנתונים שלו?"))return;
    const id=el.dataset.id;
    setSyncStatus("busy");
    sb.deleteLogs(id).then(()=>sb.deleteBaby(id)).then(()=>{
      const babies=state.babies.filter(b=>b.id!==id);
      store.saveBabies(babies);
      setState({babies,syncStatus:"ok"});
    }).catch(()=>{
      const babies=state.babies.filter(b=>b.id!==id);
      store.saveBabies(babies);
      setState({babies,syncStatus:"err"});
    });
  }
  else if(action==="start-add")setState({addingBaby:true});
  else if(action==="cancel-add")setState({addingBaby:false,newBabyName:"",newBabyEmoji:"☁️",newBabyDob:""});
  else if(action==="pick-emoji")setState({newBabyEmoji:el.dataset.emoji});
  else if(action==="confirm-add"){
    if(!state.newBabyName.trim())return;
    const baby={id:Date.now().toString(),name:state.newBabyName.trim(),emoji:state.newBabyEmoji,dob:state.newBabyDob,createdAt:Date.now()};
    const babies=[...state.babies,baby];
    store.saveBabies(babies);
    setState({babies,screen:"dashboard",selectedBaby:baby,logs:[],tab:"home",modal:null,isNight:null,addingBaby:false,newBabyName:"",newBabyEmoji:"☁️",newBabyDob:"",dobInput:baby.dob||"",syncStatus:"busy"});
    sb.upsertBaby(babyToRow(baby)).then(()=>setSyncStatus("ok")).catch(()=>setSyncStatus("err"));
  }
  else if(action==="go-back"){clearInterval(sleepTimer);clearInterval(feedTimer);setState({screen:"selector",selectedBaby:null,logs:[],modal:null});}
  else if(action==="toggle-night"){
    const autoNight=new Date().getHours()>=21||new Date().getHours()<6;
    setState({isNight:!(state.isNight!==null?state.isNight:autoNight)});
  }
  else if(action==="set-tab")setState({tab:el.dataset.tab});
  else if(action==="open-modal"){
    clearInterval(sleepTimer);clearInterval(feedTimer);
    setState({modal:el.dataset.type,feedType:"breast_left",amount:"",ml:"",diaperType:"wet",medName:"",medDose:"",note:"",sleeping:false,sleepStart:null,elapsed:0,timerMs:null,feedRunning:false,feedStart:null,feedEl:0});
  }
  else if(action==="close-modal"){
    if(!confirm("לסגור ולבטל את הרישום?"))return;
    clearInterval(sleepTimer);clearInterval(feedTimer);setState({modal:null});
  }
  else if(action==="save-log")saveLog();
  else if(action==="delete-log"){
    const lid=el.dataset.id;
    if(!confirm("למחוק רשומה זו?"))return;
    const logs=state.logs.filter(l=>String(l.id)!==lid);
    store.saveLogs(state.selectedBaby.id,logs);
    setState({logs,syncStatus:"busy"});
    sb.deleteLog(lid).then(()=>setSyncStatus("ok")).catch(()=>setSyncStatus("err"));
  }
  else if(action==="export-csv")exportCSV(state.logs,state.selectedBaby.name);
  else if(action==="clear-logs"){
    if(!confirm("למחוק את כל הנתונים?"))return;
    store.saveLogs(state.selectedBaby.id,[]);
    setState({logs:[],syncStatus:"busy"});
    sb.deleteLogs(state.selectedBaby.id).then(()=>setSyncStatus("ok")).catch(()=>setSyncStatus("err"));
  }
  else if(action==="edit-dob")setState({editDob:true,dobInput:state.selectedBaby.dob||""});
  else if(action==="cancel-dob")setState({editDob:false});
  else if(action==="save-dob"){
    const baby={...state.selectedBaby,dob:state.dobInput};
    const babies=state.babies.map(b=>b.id===baby.id?baby:b);
    store.saveBabies(babies);
    setState({selectedBaby:baby,babies,editDob:false,syncStatus:"busy"});
    sb.upsertBaby(babyToRow(baby)).then(()=>setSyncStatus("ok")).catch(()=>setSyncStatus("err"));
  }
  else if(action==="set-feed-type")setState({feedType:el.dataset.val,feedRunning:false,feedStart:null,feedEl:0,timerMs:null});
  else if(action==="feed-timer-start"){
    const s=Date.now();state.feedStart=s;state.feedRunning=true;
    clearInterval(feedTimer);
    feedTimer=setInterval(()=>setState({feedEl:Date.now()-state.feedStart}),1000);
    setState({feedRunning:true});
  }
  else if(action==="feed-timer-pause"){clearInterval(feedTimer);setState({feedRunning:false});}
  else if(action==="feed-timer-resume"){
    const offset=state.feedEl,now=Date.now();
    state.feedStart=now-offset;
    clearInterval(feedTimer);
    feedTimer=setInterval(()=>setState({feedEl:Date.now()-state.feedStart}),1000);
    setState({feedRunning:true});
  }
  else if(action==="feed-timer-done"){
    clearInterval(feedTimer);
    const ms=state.feedEl;
    setState({feedRunning:false,timerMs:ms,amount:String(Math.round(ms/60000))});
  }
  else if(action==="sleep-start"){
    const s=Date.now();state.sleepStart=s;
    clearInterval(sleepTimer);
    sleepTimer=setInterval(()=>setState({elapsed:Date.now()-state.sleepStart}),1000);
    setState({sleeping:true});
  }
  else if(action==="sleep-stop"){clearInterval(sleepTimer);setState({sleeping:false});}
  else if(action==="edit-time")setState({editingTimeId:el.dataset.id});
  else if(action==="cancel-time")setState({editingTimeId:null});
  else if(action==="save-time"){
    const lid=el.dataset.id;
    const input=document.getElementById("time-edit-"+lid);
    if(!input)return;
    const newTs=new Date(input.value).getTime();
    if(isNaN(newTs))return;
    const logs=state.logs.map(l=>String(l.id)===lid?{...l,ts:newTs}:l);
    store.saveLogs(state.selectedBaby.id,logs);
    setState({logs,editingTimeId:null,syncStatus:"busy"});
    const updated=logs.find(l=>String(l.id)===lid);
    if(updated)sb.upsertLog(logToRow(updated,state.selectedBaby.id)).then(()=>setSyncStatus("ok")).catch(()=>setSyncStatus("err"));
  }
}

function saveLog(){
  const amtEl=document.getElementById("modal-amount");
  const mlEl=document.getElementById("modal-ml");
  const noteEl=document.getElementById("modal-note");
  const medNameEl=document.getElementById("modal-med-name");
  const medDoseEl=document.getElementById("modal-med-dose");
  if(amtEl)state.amount=amtEl.value;
  if(mlEl)state.ml=mlEl.value;
  if(noteEl)state.note=noteEl.value;
  if(medNameEl)state.medName=medNameEl.value;
  if(medDoseEl)state.medDose=medDoseEl.value;

  if(state.modal==="sleep"&&!state.sleepStart&&!state.elapsed){alert("לחץ על 'התחל להקליט שינה' קודם");return;}

  const id=String(Date.now()+Math.random());
  const base={type:state.modal,ts:Date.now(),note:state.note,id};
  let log;
  if(state.modal==="feed")log={...base,subtype:state.feedType,amount:state.amount?Number(state.amount):null,ml:state.ml?Number(state.ml):null,durationMs:state.timerMs||null};
  else if(state.modal==="diaper")log={...base,subtype:state.diaperType};
  else if(state.modal==="sleep"){
    const finalMs=state.sleeping?Date.now()-state.sleepStart:state.elapsed;
    clearInterval(sleepTimer);
    log={...base,subtype:"tracked",durationMs:finalMs};
  }
  else if(state.modal==="med")log={...base,medName:state.medName,medDose:state.medDose};
  else log=base;

  clearInterval(feedTimer);
  const logs=[log,...state.logs];
  store.saveLogs(state.selectedBaby.id,logs);
  setState({logs,modal:null,sleeping:false,sleepStart:null,elapsed:0,feedRunning:false,feedStart:null,feedEl:0,syncStatus:"busy"});

  sb.upsertLog(logToRow(log,state.selectedBaby.id))
    .then(()=>setSyncStatus("ok"))
    .catch(()=>setSyncStatus("err"));
}

// ── Start ──────────────────────────────────────────────────────────────────
init();

// ── PWA Service Worker + Install Banner ───────────────────────────────────
let _deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();
  _deferredPrompt=e;
  showInstallBanner();
});
function showInstallBanner(){
  if(localStorage.getItem("bt_install_dismissed"))return;
  const b=document.createElement("div");
  b.id="install-banner";
  b.style.cssText="position:fixed;bottom:90px;left:50%;transform:translateX(50%);width:calc(100% - 28px);max-width:452px;background:#2C6BAC;color:#fff;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,0.2);font-family:'Nunito',sans-serif;direction:rtl";
  b.innerHTML=`<span style="font-size:26px">🍼</span><div style="flex:1"><div style="font-weight:800;font-size:14px">Baby Tracker</div><div style="font-size:12px;opacity:0.85">הוסף למסך הבית לגישה מהירה</div></div><button onclick="doInstall()" style="background:#fff;color:#2C6BAC;border:none;border-radius:8px;padding:8px 14px;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;cursor:pointer">התקן</button><button onclick="dismissInstall()" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:0 4px">✕</button>`;
  document.body.appendChild(b);
}
function doInstall(){
  if(!_deferredPrompt)return;
  _deferredPrompt.prompt();
  _deferredPrompt.userChoice.then(()=>{_deferredPrompt=null;dismissInstall();});
}
function dismissInstall(){
  localStorage.setItem("bt_install_dismissed","1");
  const b=document.getElementById("install-banner");
  if(b)b.remove();
}
if("serviceWorker" in navigator){
  const sw=`const C="bt-v1";self.addEventListener("install",e=>e.waitUntil(caches.open(C).then(c=>c.add("/"))));self.addEventListener("fetch",e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));`;
  const blob=new Blob([sw],{type:"application/javascript"});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>
